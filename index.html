
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RealKid Hub Key</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --blue: #168bff;
  --cyan: #55e4ff;
  --bg: #030711;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
  overflow-x: hidden;
  background: var(--bg);
  color: #fff;
  font-family: Inter, sans-serif;
  isolation: isolate;
}

#particles {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -2;
  pointer-events: none;
}

.ambient {
  position: fixed;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  filter: blur(110px);
  opacity: .23;
  pointer-events: none;
  z-index: -1;
  animation: ambientFloat 10s ease-in-out infinite alternate;
}

.ambient.a {
  background: #087cff;
  left: -140px;
  top: -120px;
}

.ambient.b {
  background: #00d9ff;
  right: -150px;
  bottom: -150px;
  animation-delay: -5s;
}

.grid {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: .13;
  background-image:
    linear-gradient(#168bff22 1px, transparent 1px),
    linear-gradient(90deg, #168bff22 1px, transparent 1px);
  background-size: 42px 42px;
  mask-image: radial-gradient(ellipse at center, black, transparent 85%);
  animation: gridMove 18s linear infinite;
}

.card {
  width: 100%;
  max-width: 440px;
  position: relative;
  padding: 38px 30px 27px;
  border: 1px solid #39aaff35;
  border-radius: 26px;
  background: linear-gradient(145deg,
    rgba(14, 27, 48, .94),
    rgba(4, 10, 21, .96));
  backdrop-filter: blur(22px);
  box-shadow:
    0 25px 100px #0008,
    0 0 50px #087cff13,
    inset 0 1px 0 #ffffff12;
  animation: cardEnter 1s cubic-bezier(.2,.8,.2,1) both;
  overflow: hidden;
}

.card::before {
  content: "";
  position: absolute;
  inset: -100%;
  background: conic-gradient(
    from 0deg,
    transparent 0 75%,
    #3bdfff55 82%,
    #168bff 85%,
    transparent 90% 100%
  );
  animation: borderSpin 8s linear infinite;
  pointer-events: none;
}

.card::after {
  content: "";
  position: absolute;
  inset: 1px;
  border-radius: 25px;
  background: linear-gradient(150deg, #0b192b, #050b15 75%);
  pointer-events: none;
}

.card > * {
  position: relative;
  z-index: 1;
}

.scanline {
  position: absolute;
  z-index: 2;
  left: 0;
  right: 0;
  top: -100%;
  height: 100px;
  pointer-events: none;
  background: linear-gradient(
    transparent,
    #1e9dff09,
    #4bd9ff16,
    transparent
  );
  animation: scan 7s ease-in-out infinite;
}

.logo-wrap {
  width: 104px;
  height: 104px;
  margin: 0 auto 24px;
  display: grid;
  place-items: center;
  position: relative;
}

.logo-ring {
  position: absolute;
  inset: 0;
  border: 1px solid #36b8ff60;
  border-radius: 31px;
  animation: ringPulse 3s ease-in-out infinite;
}

.logo-ring::before,
.logo-ring::after {
  content: "";
  position: absolute;
  inset: -7px;
  border: 1px solid #168bff35;
  border-radius: 36px;
  animation: ringOrbit 8s linear infinite;
}

.logo-ring::after {
  inset: -14px;
  border-style: dashed;
  border-color: #55e4ff30;
  animation-direction: reverse;
  animation-duration: 22s;
}

.logo {
  width: 88px;
  height: 88px;
  display: grid;
  place-items: center;
  border-radius: 26px;
  background: linear-gradient(145deg, #153a61, #07101d);
  box-shadow:
    inset 0 0 25px #168bff20,
    0 0 28px #168bff30;
  animation: logoFloat 4s ease-in-out infinite;
  position: relative;
  overflow: hidden;
}

.logo::after {
  content: "";
  position: absolute;
  inset: -100%;
  background: linear-gradient(
    110deg,
    transparent 40%,
    #ffffff30 50%,
    transparent 60%
  );
  animation: logoShine 4s ease-in-out infinite;
}

.logo span {
  font-family: Orbitron, sans-serif;
  font-weight: 900;
  font-size: 55px;
  color: transparent;
  background: linear-gradient(145deg, white, #64ddff 55%, #168bff);
  background-clip: text;
  -webkit-background-clip: text;
  filter: drop-shadow(0 0 13px #168bff75);
}

.status {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 9px;
  margin-bottom: 13px;
  color: #8acfff;
  font-size: 10px;
  letter-spacing: 3px;
  font-weight: 800;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #42f5bd;
  box-shadow: 0 0 12px #42f5bd;
  animation: dotPulse 1.8s ease-in-out infinite;
}

h1 {
  text-align: center;
  font-family: Orbitron, sans-serif;
  font-size: clamp(24px, 6vw, 30px);
  letter-spacing: -1px;
  font-weight: 900;
  margin-bottom: 12px;
  animation: textReveal .9s .2s both;
}

h1 span {
  color: var(--cyan);
  text-shadow: 0 0 25px #168bff50;
}

.subtitle {
  text-align: center;
  color: #879cb5;
  font-size: 13px;
  line-height: 1.8;
  margin-bottom: 29px;
}

.field-label {
  display: block;
  margin-bottom: 11px;
  color: #a1bad4;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2px;
}

.key-box {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 62px;
  padding: 12px;
  border: 1px solid #254667;
  border-radius: 13px;
  background: #030914;
  transition: border-color .35s, box-shadow .35s, transform .35s;
}

.key-box:hover {
  border-color: #31baff;
  box-shadow: 0 0 25px #168bff18;
  transform: translateY(-2px);
}

#keyText {
  flex: 1;
  min-width: 0;
  color: #e1f4ff;
  font-size: 12px;
  line-height: 1.8;
  overflow-wrap: anywhere;
  user-select: all;
}

.copy-icon {
  flex-shrink: 0;
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border: 1px solid #328ee0;
  border-radius: 10px;
  color: #6bd9ff;
  background: #102c49;
  cursor: pointer;
  transition: all .25s ease;
}

.copy-icon:hover {
  color: white;
  background: #1679d9;
  box-shadow: 0 0 20px #168bff60;
  transform: rotate(-5deg) scale(1.07);
}

.copy-button {
  width: 100%;
  min-height: 53px;
  margin-top: 15px;
  position: relative;
  overflow: hidden;
  border: 1px solid #66d7ff55;
  border-radius: 12px;
  background: linear-gradient(100deg, #1267e8, #0faeea, #1267e8);
  background-size: 200% 100%;
  color: white;
  font: 800 12px Inter, sans-serif;
  letter-spacing: 2px;
  cursor: pointer;
  box-shadow: 0 7px 25px #168bff30;
  transition: transform .25s, box-shadow .3s, background-position .5s;
  animation: buttonGradient 5s ease infinite;
}

.copy-button::before {
  content: "";
  position: absolute;
  top: -50%;
  bottom: -50%;
  left: -40%;
  width: 25%;
  transform: rotate(20deg);
  background: #ffffff35;
  filter: blur(8px);
  transition: left .6s ease;
}

.copy-button:hover::before {
  left: 130%;
}

.copy-button:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 35px #168bff50;
}

.copy-button:active {
  transform: scale(.975);
}

#message {
  height: 18px;
  margin-top: 11px;
  color: #50edc0;
  font-size: 11px;
  text-align: center;
  transition: opacity .3s;
}

.footer {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  border-top: 1px solid #ffffff0d;
  padding-top: 19px;
  margin-top: 13px;
  color: #61758d;
  font-size: 9px;
  letter-spacing: 1px;
}

.footer b {
  color: #65caff;
}

@keyframes cardEnter {
  from { opacity: 0; transform: translateY(28px) scale(.96); filter: blur(8px); }
  to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}

@keyframes borderSpin {
  to { transform: rotate(360deg); }
}

@keyframes ringPulse {
  0%, 100% { transform: scale(1); opacity: .75; }
  50% { transform: scale(1.045); opacity: 1; }
}

@keyframes ringOrbit {
  to { transform: rotate(360deg); }
}

@keyframes logoFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

@keyframes logoShine {
  0%, 45% { transform: translateX(-45%) rotate(10deg); }
  75%, 100% { transform: translateX(45%) rotate(10deg); }
}

@keyframes dotPulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 12px #42f5bd; }
  50% { opacity: .5; box-shadow: 0 0 3px #42f5bd; }
}

@keyframes scan {
  0%, 20% { top: -120px; }
  70%, 100% { top: 120%; }
}

@keyframes ambientFloat {
  to { transform: translate(55px, 40px) scale(1.15); }
}

@keyframes gridMove {
  to { background-position: 42px 42px; }
}

@keyframes textReveal {
  from { opacity: 0; letter-spacing: 3px; }
  to { opacity: 1; letter-spacing: -1px; }
}

@keyframes buttonGradient {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

@media (max-width: 440px) {
  body { padding: 18px; }
  .card { padding: 33px 21px 25px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>
<canvas id="particles"></canvas>
<div class="ambient a"></div>
<div class="ambient b"></div>
<div class="grid"></div>

<main class="card">
  <div class="scanline"></div>

  <div class="logo-wrap">
    <div class="logo-ring"></div>
    <div class="logo"><span>R</span></div>
  </div>

  <div class="status">
    <span class="dot"></span>
    KEY SYSTEM ONLINE
  </div>

  <h1>RealKid <span>Hub</span></h1>

  <p class="subtitle">
    Welcome to RealKid Hub<br>
    Your key is ready to copy.
  </p>

  <label class="field-label" for="keyText">YOUR ACCESS KEY</label>

  <div class="key-box">
    <div id="keyText">RealKidHubKeyKsjwowon - KalwojwbekekdnHalwoeuhejeke</div>

    <button class="copy-icon" id="smallCopy"
      aria-label="Copy key" title="Copy Key">
      <svg width="17" height="17" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="8" y="8" width="12" height="12" rx="2"/>
        <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>
      </svg>
    </button>
  </div>

  <button class="copy-button" id="copyButton">COPY KEY &nbsp; ↗</button>
  <p id="message" role="status" aria-live="polite"></p>

  <div class="footer">
    <span>POWERED BY</span>
    <b>REAL KID HUB</b>
    <span>•</span>
    <span>V1.0</span>
  </div>
</main>

<script>
const key = "RealKidHubKeyKsjwowon - KalwojwbekekdnHalwoeuhejeke";
const copyButton = document.getElementById("copyButton");
const smallCopy = document.getElementById("smallCopy");
const message = document.getElementById("message");

async function copyKey() {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(key);
    } else {
      const area = document.createElement("textarea");
      area.value = key;
      area.style.position = "fixed";
      area.style.left = "-9999px";
      document.body.appendChild(area);
      area.select();
      const success = document.execCommand("copy");
      area.remove();
      if (!success) throw new Error("Copy failed");
    }

    message.textContent = "✓ KEY COPIED SUCCESSFULLY!";
    copyButton.textContent = "COPIED SUCCESSFULLY ✓";
    copyButton.style.filter = "brightness(1.2)";

    setTimeout(() => {
      message.textContent = "";
      copyButton.textContent = "COPY KEY  ↗";
      copyButton.style.filter = "";
    }, 2200);
  } catch (error) {
    message.textContent = "Copy failed. Select the key and copy manually.";
  }
}

copyButton.addEventListener("click", copyKey);
smallCopy.addEventListener("click", copyKey);

// Animated blue and cyan particles
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
let particles = [];
let width = 0;
let height = 0;
let animationFrame;

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const count = Math.min(75, Math.floor(width * height / 10000));
  particles = Array.from({ length: count }, () => ({
    x: Math.random() * width,
    y: Math.random() * height,
    r: Math.random() * 1.8 + .4,
    speed: Math.random() * .35 + .12,
    drift: (Math.random() - .5) * .35,
    alpha: Math.random() * .55 + .2,
    phase: Math.random() * Math.PI * 2
  }));
}

function drawParticles() {
  ctx.clearRect(0, 0, width, height);

  for (const p of particles) {
    p.y -= p.speed;
    p.x += p.drift;
    p.phase += .018;

    if (p.y < -5) {
      p.y = height + 5;
      p.x = Math.random() * width;
    }
    if (p.x < -5) p.x = width + 5;
    if (p.x > width + 5) p.x = -5;

    const alpha = p.alpha * (.65 + .35 * Math.sin(p.phase));

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(75, 190, 255, ${alpha})`;
    ctx.shadowBlur = 9;
    ctx.shadowColor = "#168bff";
    ctx.fill();
  }

  ctx.shadowBlur = 0;
  animationFrame = requestAnimationFrame(drawParticles);
}

resizeCanvas();
drawParticles();

let resizeTimeout;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(resizeCanvas, 120);
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    cancelAnimationFrame(animationFrame);
  } else {
    cancelAnimationFrame(animationFrame);
    drawParticles();
  }
});
</script>
</body>
</html>
